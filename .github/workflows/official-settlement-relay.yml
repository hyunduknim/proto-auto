name: Official Betman settlement relay

on:
  push:
    branches: [main]
  schedule:
    # Every five minutes (GitHub Actions minimum); the active relay
    # chain and independent watchdog cover missed scheduler events.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: protonumber-official-settlement-relay
  cancel-in-progress: false

jobs:
  settle:
    name: Fetch official GameInfo and securely settle pending bets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch official results via runner and send using signed GitHub identity
        env:
          PROTONUMBER_URL: https://protonumber.mystyle276.workers.dev
          GITHUB_OIDC_AUD: protonumber-official-settlement
        run: |
          node <<'NODE'
          const base=process.env.PROTONUMBER_URL, aud=process.env.GITHUB_OIDC_AUD;
          const timeout=ms=>AbortSignal.timeout(ms);
          const betmanHeaders=ref=>({
            "content-type":"application/json; charset=UTF-8",
            "accept":"application/json, text/javascript, */*; q=0.01",
            "x-requested-with":"XMLHttpRequest",
            "origin":"https://www.betman.co.kr",
            "referer":ref,
            "user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
            "cache-control":"no-cache","pragma":"no-cache"
          });
          async function officialGameInfo(ts){
            const u="https://www.betman.co.kr/buyPsblGame/gameInfoInq.do";
            const ref="https://www.betman.co.kr/main/mainPage/gamebuy/gameSlip.do?gmId=G101&gmTs="+encodeURIComponent(ts);
            const body=JSON.stringify({gmId:"G101",gmTs:String(ts),gameYear:"",_sbmInfo:{debugMode:"false"}});
            for(let attempt=1;attempt<=2;attempt++){
              try{
                const r=await fetch(u,{method:"POST",headers:betmanHeaders(ref),body,redirect:"follow",signal:timeout(12000)});
                if(!r.ok)throw Error("HTTP_"+r.status);
                const data=await r.json();
                if(String(data.gmTs||ts)!==ts||!Array.isArray(data.compSchedules?.keys)||!Array.isArray(data.compSchedules?.datas))throw Error("invalid official schedule/round");
                return data;
              }catch(e){
                console.log("Official GameInfo",ts,"attempt",attempt,"failed:",String(e.message||e).slice(0,120));
                if(attempt===2)throw e;
                await new Promise(r=>setTimeout(r,1000));
              }
            }
          }
          // Result API is sometimes available even when a full schedule is not.
          // It is optional: failure never prevents gameInfo from being sent.
          async function officialResultInfo(ts){
            const u="https://www.betman.co.kr/gamebuy/winrst/inqWinrstDetlBody.do";
            const ref="https://www.betman.co.kr/main/mainPage/gamebuy/winrstDetl.do?gmId=G101&gmTs="+encodeURIComponent(ts);
            const body=JSON.stringify({gmId:"G101",gmTs:String(ts),_sbmInfo:{debugMode:"false"}});
            let lastError;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const r=await fetch(u,{method:"POST",headers:betmanHeaders(ref),body,
                  redirect:"follow",signal:timeout(12000)});
                if(!r.ok)throw Error("RESULT_HTTP_"+r.status);
                const data=await r.json();
                if(data?.gmTs!=null&&String(data.gmTs)!==ts)throw Error("result round mismatch");
                return data;
              }catch(e){
                lastError=e;
                console.log("Official ResultInfo",ts,"attempt",attempt,
                  "failed:",String(e?.message||e).slice(0,120));
                if(attempt<3)await new Promise(resolve=>setTimeout(resolve,attempt*1200));
              }
            }
            throw lastError;
          }
          async function signedToken(){
            const endpoint=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL||"");
            const bearer=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if(!bearer)throw Error("GitHub OIDC permission missing");
            endpoint.searchParams.set("audience",aud);
            const r=await fetch(endpoint,{headers:{"Authorization":"Bearer "+bearer},signal:timeout(12000)});
            if(!r.ok)throw Error("OIDC_HTTP_"+r.status);
            const j=await r.json();
            if(!j.value)throw Error("OIDC token missing");
            return j.value;
          }
          (async()=>{
            const response=await fetch(base+"/api/state",{signal:timeout(20000)});
            if(!response.ok)throw Error("Worker state HTTP "+response.status);
            const state=await response.json();
            const nos=state.resultAudit?.pendingNos||[];
            // Live UI can discover started games before the direct Betman result audit refreshes.
            // Include both current UI pending and historical-round audit entries.
            const now=Date.now();
            const started=(state.markingGames||[]).filter(m=>{
              if(!m.pick||m.resultFinal||!m.date||!m.time)return false;
              const dt=Date.parse(String(m.date)+"T"+String(m.time).slice(0,5)+":00+09:00");
              return Number.isFinite(dt)&&dt<=now;
            });
            // R348: always fetch the currently selected G101 round's official
            // odds, even if no settled/pending games exist. This is also an odds relay.
            const activeGmTs=String(state.gmTs||"");
            const rounds=[...new Set([
              ...[...nos,...started].map(m=>String(m.gmTs||"")),
              ...(/^\d{6}$/.test(activeGmTs)?[activeGmTs]:[])
            ].filter(x=>/^\d{6}$/.test(x)))].sort((a,b)=>Number(b)-Number(a)).slice(0,4);
            if(!rounds.length){console.log("No known G101 round and no pending settlements; skipping relay.");return;}
            const token=await signedToken();
            let delivered=0,settled=0,failures=0;
            for(const ts of rounds){
              try{
                const [gameInfoStatus,resultInfoStatus]=await Promise.allSettled([
                  officialGameInfo(ts),officialResultInfo(ts)]);
                if(gameInfoStatus.status==="rejected"&&resultInfoStatus.status==="rejected")
                  throw Error("both official endpoints unavailable: "+String(gameInfoStatus.reason?.message||"gameInfo"));
                const payload={gmTs:ts};
                if(gameInfoStatus.status==="fulfilled")payload.gameInfo=gameInfoStatus.value;
                if(resultInfoStatus.status==="fulfilled")payload.officialResult=resultInfoStatus.value;
                // Authenticated OIDC metadata is diagnostic only; never settles a market.
                payload.sourceStatus={
                  gameInfo:gameInfoStatus.status,resultApi:resultInfoStatus.status,
                  resultApiError:resultInfoStatus.status==="rejected"?
                    String(resultInfoStatus.reason?.message||resultInfoStatus.reason||"").slice(0,140):null
                };
                console.log("OFFICIAL_SOURCES="+JSON.stringify({gmTs:ts,
                  ...payload.sourceStatus}));
                // GitHub push triggers this workflow before Cloudflare Workers Builds finishes.
                // Retry the relay endpoint only during the deployment race; never modify market data.
                let data={};let deliveredToWorker=false;
                for(let deliveryAttempt=1;deliveryAttempt<=10;deliveryAttempt++){
                  const r=await fetch(base+"/api/official-gameinfo-relay",{
                    method:"POST",headers:{"authorization":"Bearer "+token,"content-type":"application/json"},
                    body:JSON.stringify(payload),signal:timeout(45000)
                  });
                  data=await r.json().catch(()=>({}));
                  if(r.ok&&data.ok){
                    if(ts===activeGmTs&&payload.gameInfo&&
                      !data.officialOddsRelay&&deliveryAttempt<10){
                      console.log("Waiting for live Worker official-price-relay support",deliveryAttempt);
                      await new Promise(resolve=>setTimeout(resolve,5000));
                      continue;
                    }
                    deliveredToWorker=true;break;
                  }
                  if([404,429,500,502,503,504].includes(r.status)&&deliveryAttempt<10){
                    console.log("Worker relay temporarily unavailable, retry",deliveryAttempt,"of 10",r.status);
                    await new Promise(resolve=>setTimeout(resolve,5000));
                    continue;
                  }
                  throw Error("Worker relay HTTP "+r.status+" "+String(data.error||"").slice(0,130));
                }
                if(!deliveredToWorker)throw Error("Official relay failed after deployment retries");
                console.log("OFFICIAL_SETTLEMENT_RELAY="+JSON.stringify({
                  gmTs:ts,verifiedRows:data.verifiedRows,officialResultRows:data.resultApiRows||0,
                  officialGameInfoRows:data.gameInfoRows||0,settledNow:data.settledNow,
                  pendingBefore:data.pendingBefore,pendingAfter:data.pendingAfter,
                  officialOddsRelay:data.officialOddsRelay||null
                }));
                delivered++;settled+=Number(data.settledNow||0);
              }catch(e){failures++;console.error("OFFICIAL_RELAY_ERROR:",ts,String(e.message||e).slice(0,200));}
            }
            console.log("OFFICIAL_RELAY_SUMMARY="+JSON.stringify({rounds:rounds.length,delivered,settled,failures}));
            // Read back persisted official-settlement counters, not just the POST acknowledgment.
            const finalResponse=await fetch(base+"/api/state",{signal:timeout(20000)});
            if(!finalResponse.ok)throw Error("read-back state HTTP "+finalResponse.status);
            const final=await finalResponse.json();
            console.log("OFFICIAL_RELAY_LIVE_CHECK="+JSON.stringify({version:final.version,
              round:final.round,settled:final.summary?.settled,hits:final.summary?.hits,
              misses:final.summary?.misses,voids:final.summary?.voids,
              pending:final.settlementHealth?.pending??final.resultAudit?.pending,
              lastRelaySettledAt:final.relayAudit?.lastSettlementAt,
              relayRounds:Object.keys(final.relayAudit?.rounds||{}),
              grades:final.gradeAudit?.counts||{},
              sourceStatus:{ok:final.sourceAudit?.ok,
                source:final.sourceAudit?.source,
                error:final.sourceAudit?.error||final.sourceAudit?.reason||null,
                lastSuccessAt:final.sourceAudit?.lastSuccessAt},
              officialOddsRelayAudit:final.officialOddsRelayAudit||null,
              hour14:(final.markingGames||[]).filter(m=>
                m.date===new Intl.DateTimeFormat("en-CA",{
                  timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
                }).format(new Date())&&String(m.time||"").startsWith("14:"))
                .map(m=>({no:m.no,game:m.game,pick:m.pick,odds:m.odds,
                  pricedMarkets:(m.marketRows||[]).filter(row=>
                    (row.choices||[]).some(c=>Number(c.odds)>1)).length}))
              }));
            if(failures)process.exitCode=1;
          })().catch(e=>{console.error("OFFICIAL_RELAY_FATAL:",String(e.message||e).slice(0,160));process.exitCode=1;});
          NODE

      - name: Continue five-minute official polling while matches are active
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub's scheduled ten-minute events may be delayed or skipped.
            // Keep a five-minute relay chain alive while represented games are
            // running or awaiting officially verified outcomes up to 48 hours after kickoff.
            // Continue even if the prior POST failed with a transient Worker 502.
            // The OIDC-verified official relay above is the ONLY settlement writer.
            const endpoint="https://protonumber.mystyle276.workers.dev/api/state";
            const load=async()=>{
              const r=await fetch(endpoint+"?live="+Date.now(),{
                headers:{"cache-control":"no-cache"},signal:AbortSignal.timeout(20000)
              });
              if(!r.ok)throw Error("Live relay state HTTP "+r.status);
              return r.json();
            };
            const relevant=state=>{
              const now=Date.now(),rows=state.markingGames||[];
              const t=m=>Date.parse(String(m.date||"")+"T"+
                String(m.time||"").slice(0,5)+":00+09:00");
              const open=rows.filter(m=>m.pick&&!m.resultFinal&&Number.isFinite(t(m)));
              const running=open.filter(m=>t(m)<=now&&now-t(m)<=48*3600000);
              const imminent=open.filter(m=>t(m)>now&&t(m)-now<=20*60000);
              return {pending:running.length,imminent:imminent.length,
                settled:state.summary?.settled||0};
            };
            const state=await load();
            let activity=relevant(state);
            core.info("OFFICIAL_LIVE_CONTINUE="+JSON.stringify({...activity,round:state.round}));
            if(activity.pending===0&&activity.imminent===0){
              core.info("No live or imminent represented games; stop active polling.");
              return;
            }
            // Do not chain every ~minute. Wait approximately four minutes so the next
            // official refresh occurs about five minutes after the current one. GitHub scheduling remains best-effort.
            // The independent watchdog covers abrupt job/runner termination.
            await new Promise(resolve=>setTimeout(resolve,4*60*1000));
            const current=await load();
            activity=relevant(current);
            if(activity.pending===0&&activity.imminent===0){
              core.info("Pending games cleared; no next relay needed.");
              return;
            }
            const {data:existing}=await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:"official-settlement-relay.yml",per_page:20
            });
            const other=(existing.workflow_runs||[]).filter(w=>
              w.id!==context.runId&&["queued","pending","in_progress","waiting","requested"]
                .includes(w.status));
            if(other.length){
              core.info("OFFICIAL_LIVE_QUEUED="+other.map(w=>w.id).join(","));
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:"official-settlement-relay.yml",ref:"main"
            });
            core.info("OFFICIAL_LIVE_NEXT_DISPATCHED=1");
