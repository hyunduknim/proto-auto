name: Deploy verified marking repair
on:
  push:
    branches: [main]
    paths:
      - '자동마킹.js'
      - '.github/workflows/deploy-marking-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protonumber-marking-repair
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and repair behavior
        run: |
          node --input-type=module --check < 자동마킹.js
          node tests/r503-fast-read.cjs
          node tests/r504-public-wire.cjs
          node tests/r488-settlement-runtime.cjs
      - name: Deploy preserved Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare deployment token is not configured in GitHub secrets."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
