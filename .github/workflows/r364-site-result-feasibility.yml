name: R364 compare ZenToto and WiseToto settlement freshness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r364-site-result-feasibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test publicly accessible settlement rows and premium Proto identifiers
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const urls=[
              {name:"ZenToto current",url:"https://www.zentoto.com/proto"},
              {name:"ZenToto legacy",url:"https://v1.zentoto.com/proto/game"},
              {name:"WiseToto",url:"https://www.wisetoto.com/index.htm?tab_type=proto"},
              {name:"WiseToto round",url:"https://www.wisetoto.com/index.htm?tab_type=proto&game_year=2026&game_round=120"}
            ];
            const targets=[7287,7295,7310,7324,7328,7332,7346,7356],report=[];
            for(const row of urls){
              const started=Date.now();try{
                const r=await fetch(row.url,{signal:AbortSignal.timeout(12000),headers:{
                  accept:"text/html,application/xhtml+xml;q=0.9,*/*;q=0.8",
                  "user-agent":"Mozilla/5.0 (compatible; public settlement feasibility check)",
                  "cache-control":"no-cache"},redirect:"follow"});
                const data=await r.text();
                const samples=targets.map(n=>{
                  const m=data.match(new RegExp("(?<!\\d)"+n+"(?!\\d)"));
                  if(!m)return {no:n,found:false};
                  const around=data.slice(Math.max(0,m.index-180),Math.min(data.length,m.index+1400))
                    .replace(/<script[^>]*>[\s\S]*?<\/script>/gi," ")
                    .replace(/<style[^>]*>[\s\S]*?<\/style>/gi," ")
                    .replace(/<[^>]+>/g," ").replace(/&nbsp;|&#160;/g," ")
                    .replace(/\s+/g," ").slice(0,550);
                  const statuses=[...around.matchAll(/경기종료|후반\s*90|전반|경기전|취소|연기|FT|Finished/gi)].map(x=>x[0]);
                  return {no:n,found:true,statuses:statuses.slice(0,3),sample:around.slice(0,290)};
                });
                report.push({name:row.name,status:r.status,finalUrl:r.url,bytes:data.length,
                  timeMs:Date.now()-started,html:data.includes("<html")||data.includes("<!DOCTYPE"),
                  matches:samples.filter(x=>x.found).length,samples});
              }catch(e){report.push({name:row.name,error:String(e.message||e),timeMs:Date.now()-started});}
            }
            console.log("R364_FEASIBILITY="+JSON.stringify({checkedAt:new Date().toISOString(),providers:report}));
            // This is read-only and never writes or declares a result final.
          })().catch(e=>{console.error("R364_ERROR",String(e));process.exitCode=1});
          NODE
