name: R323 official settlement audit - read only
# FREE MODE: only manual GitHub Actions. Git push still deploys through independent Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit pending settlement vs last verified official result, with no state writes
        shell: bash
        run: |
          node <<'NODE'
          const timeout=ms=>AbortSignal.timeout(ms);
          const base="https://protonumber.mystyle276.workers.dev";
          const kst=ms=>new Date(ms).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",hour12:false});
          const req=async p=>{
            const r=await fetch(base+p+"?readonly="+Date.now(),{signal:timeout(24000),headers:{"cache-control":"no-cache"}});
            if(!r.ok)throw Error("GET "+p+" HTTP "+r.status);
            return r.json();
          };
          (async()=>{
            const [d,h]=await Promise.all([req("/api/state"),req("/api/diagnostics")]);
            const now=Date.now(),rows=d.markingGames||[],started=m=>Number.isFinite(Date.parse(m.date+"T"+m.time+":00+09:00"))&&
              Date.parse(m.date+"T"+m.time+":00+09:00")<=now;
            const unfinalized=rows.filter(m=>m.pick&&!m.resultFinal&&started(m));
            console.log("R323_LIVE_STATE="+JSON.stringify({time:kst(now),version:d.version,round:d.round,
              settled:d.summary?.settled,hits:d.summary?.hits,misses:d.summary?.misses,
              officialHealth:d.settlementHealth,relayAudit:d.relayAudit,resultAudit:{
                ok:d.resultAudit?.ok,lastAt:d.resultAudit?.lastAt,
                lastSuccessAt:d.resultAudit?.lastSuccessAt,
                source:d.resultAudit?.source,pending:d.resultAudit?.pending,
                pollMs:d.resultAudit?.pollMs,errors:d.resultAudit?.errors,
                responseShapes:d.resultAudit?.responseShapes,
                pendingNos:d.resultAudit?.pendingNos},
              diagnostic:{
                storage:h.storage,sourceAudit:h.sourceAudit,
                alarmRuns:h.alarmRuns,lastAlarmAt:h.lastAlarmAt,
                nextAlarmAt:h.nextAlarmAt,lastAlarmError:h.lastAlarmError}
              }));
            console.log("R323_PENDING_GAMES="+JSON.stringify(unfinalized.map(m=>({
              no:m.no,gmTs:m.gmTs,date:m.date,time:m.time,game:m.game,
              market:m.market,family:m.marketFamily,pick:m.pick,grade:m.displayGrade,
              overdueHours:Number(((now-Date.parse(m.date+"T"+m.time+":00+09:00"))/3600000).toFixed(2))
            }))));
            console.log("R323_ALL_PENDING_COUNT="+unfinalized.length);
          })().catch(e=>{console.error("R323_AUDIT_FAIL",String(e));process.exitCode=1;});
          NODE
