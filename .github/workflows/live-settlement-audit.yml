name: Live settlement diagnostic audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/live-settlement-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    name: Read production real-time settlement state
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch LIVE Cloudflare Worker state
        run: |
          curl --fail --location --silent --show-error --connect-timeout 5 --max-time 15 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/live-state.json" -w 'STATE_RESPONSE: http=%{http_code} first_byte=%{time_starttransfer} total=%{time_total}\n'
          test -s "$RUNNER_TEMP/live-state.json"
      - name: Report live settlement audit without exposing individual bets
        run: |
          node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const r=d.resultAudit||{},s=d.sourceAudit||{},p=d.pastGames||[],o=d.overallSummary||{};const x={at:new Date().toISOString(),version:d.version,round:d.round,gmTs:d.gmTs,updatedAt:d.updatedAt,summary:d.summary,overallSummary:{settled:o.settled,hits:o.hits,misses:o.misses,voids:o.voids,accuracy:o.accuracy},resultAudit:{ok:r.ok,lastAt:r.lastAt,lastSuccessAt:r.lastSuccessAt,pending:r.pending,settledNow:r.settledNow,voids:r.voids,checkedGmTs:r.checkedGmTs,errorsCount:Array.isArray(r.errors)?r.errors.length:null},sourceAudit:{ok:s.ok,lastAt:s.lastAt,games:s.games},pastGames:{total:p.length,hits:p.filter(z=>z.settlementStatus==="적중").length,misses:p.filter(z=>z.settlementStatus==="낙첨").length,voids:p.filter(z=>z.settlementStatus==="적특").length}};console.log("LIVE_SETTLEMENT_STATE="+JSON.stringify(x));if(!String(d.version||"").includes("R305")||!d.resultAudit)process.exit(1);' "$RUNNER_TEMP/live-state.json"
