name: Diagnose live R284
on:
  push:
    branches: [diag-r284-live]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live state
        run: curl -fsS --retry 3 --max-time 20 "https://protonumber.mystyle276.workers.dev/api/state?diag=$(date +%s)" -o state.json
      - name: Upload live state
        uses: actions/upload-artifact@v4
        with:
          name: r284-live-state
          path: state.json
          retention-days: 1
