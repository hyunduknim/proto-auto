name: Audit actual most recommended direction bias
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/r312-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read actual live best-pick direction and alternative market evidence
        run: |
          curl --fail --silent --show-error --max-time 20 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/state.json"
          node - "$RUNNER_TEMP/state.json" <<'NODE'
          const fs=require("node:fs");
          const d=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const classify=m=>{
            if(m.marketFamily==="HANDICAP"){
              const line=Number(m.handicapEffectiveLine);
              return Number.isFinite(line)&&line!==0?(line>0?"플핸":"마핸"):"핸디기타";
            }
            if(m.marketFamily==="TOTAL")return m.pick==="언더"?"언더":m.pick==="오버"?"오버":"UO기타";
            if(m.marketFamily==="MONEYLINE")return "일반승("+m.pick+")";
            return m.marketFamily||"기타";
          };
          const count=ms=>ms.reduce((a,m)=>(a[classify(m)]=(a[classify(m)]||0)+1,a),{});
          const fam=ms=>ms.reduce((a,m)=>(a[m.marketFamily||"기타"]=(a[m.marketFamily||"기타"]||0)+1,a),{});
          const mark=(d.markingGames||[]).filter(m=>m.pick&&!m.resultFinal),best=mark.filter(m=>m.displayGrade==="가장추천");
          const rec=mark.filter(m=>m.displayGrade==="추천"),normal=mark.filter(m=>m.displayGrade==="일반");
          const altRows=(m)=>m.marketRows||[];
          const families=best.map(m=>({
            chosen:classify(m),family:m.marketFamily,odds:m.odds,p:m.calibratedProbability,mp:m.marketProbability,
            quality:m.aiQuality,cross:m.crossAgreement,edge:m.modelEdge,rel:m.dataReliability,
            groups:m.independentGroupCount,alternatives:altRows(m).map(z=>({
              family:z.marketFamily,line:z.line,choice:z.analysisBestPick,selectable:z.analysisSelectable,
              prob:z.analysisProbability,edge:z.analysisModelEdge,score:z.analysisSelectionScore,quality:z.analysisQuality,
              sharedChoices:z.sharedAnalysis?.choices?.slice(0,4).map(v=>({label:v.label||v.pick,prob:v.calibratedProbability||v.calibratedP,edge:v.edge,score:v.score}))
            }))
          }));
          const dist={at:new Date().toISOString(),version:d.version,round:d.round,
            total:mark.length,best:best.length,rec:rec.length,normal:normal.length,
            all:count(mark),bestDirection:count(best),recDirection:count(rec),normalDirection:count(normal),
            bestMarket: fam(best),bestSport:best.reduce((a,m)=>(a[m.sport]=(a[m.sport]||0)+1,a),{}),
            sampleBest:families.slice(0,12),
            bestScoreRanges:best.map(m=>({
              chosen:classify(m),p:m.calibratedProbability,mp:m.marketProbability,odds:m.odds,
              quality:m.aiQuality,confidence:m.confidenceScore,rel:m.dataReliability,
              edge:m.modelEdge,groups:m.independentGroupCount,opposition:m.gradeAxisOppositionCount
            })),
            directionAudit:d.directionAudit?.warnings||[],marketMix:d.marketMixAudit?.counts,
            grade:d.gradeAudit?.counts
          };
          console.log("LIVE_DIRECTION_AUDIT="+JSON.stringify(dist));
          NODE

      - name: Summarize qualified best candidates by direction and score
        run: |
          curl --fail --silent --show-error --max-time 20 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/quality.json"
          node - "$RUNNER_TEMP/quality.json" <<'NODE'
          const d=JSON.parse(require("node:fs").readFileSync(process.argv[2],"utf8"));
          const now=Date.now(),n=x=>Number(x??0),dir=m=>m.marketFamily==="TOTAL"?
            m.pick:m.marketFamily==="HANDICAP"?(n(m.handicapEffectiveLine)>0?"플핸":"마핸"):"일반승";
          const xs=(d.markingGames||[]).filter(m=>m.pick&&!m.resultFinal&&
            Date.parse(m.date+"T"+m.time.slice(0,5)+":00+09:00")>now);
          const qualified=m=>{
            const p=n(m.calibratedProbability),mp=n(m.marketProbability),o=n(m.odds);
            return ["STRICT","DEEP_REVIEW"].includes(m.selectionMode)&&
              p>0&&mp>0&&p-mp>=(m.selectionMode==="STRICT"?.01:.005)&&
              p*o-1>=(m.selectionMode==="STRICT"?-.12:-.20)&&
              n(m.dataReliability)>=(m.selectionMode==="STRICT"?.57:.55)&&
              n(m.aiQuality)>=.60&&n(m.crossAgreement)>=(m.selectionMode==="STRICT"?.55:.50)&&
              n(m.dataIntegrityScore)>=(m.selectionMode==="STRICT"?.52:.50)&&
              n(m.independentGroupCount)>=2&&n(m.axisOppositionCount)===0&&n(m.gradeAxisOppositionCount)===0;
          };
          const good=xs.filter(qualified);
          const groups={};for(const m of good)(groups[dir(m)]??=[]).push(m);
          const stat=arr=>({n:arr.length,minQ:Math.min(...arr.map(x=>n(x.aiQuality))),
            maxQ:Math.max(...arr.map(x=>n(x.aiQuality))),
            avgQ:arr.reduce((s,x)=>s+n(x.aiQuality),0)/Math.max(arr.length,1),
            avgEdge:arr.reduce((s,x)=>s+n(x.calibratedProbability)-n(x.marketProbability),0)/Math.max(arr.length,1),
            avgEv:arr.reduce((s,x)=>s+n(x.calibratedProbability)*n(x.odds)-1,0)/Math.max(arr.length,1)});
          console.log("QUALIFIED_BY_DIRECTION="+JSON.stringify({
            all:xs.length,eligible:good.length,topDirection:Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,stat(v)])),
            grades:good.reduce((a,m)=>(a[m.displayGrade]=(a[m.displayGrade]||0)+1,a),{}),
            qualityCompare:good.slice().sort((a,b)=>n(b.aiQuality)-n(a.aiQuality)).slice(0,35).map(m=>({d:dir(m),q:m.aiQuality,edge:n(m.calibratedProbability)-n(m.marketProbability)}))
          }));
          NODE

      - name: Compare evidence-calibrated top-tier quality thresholds
        run: |
          curl --fail --silent --show-error --max-time 20 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/evidence.json"
          node - "$RUNNER_TEMP/evidence.json" <<'NODE'
          const d=JSON.parse(require("node:fs").readFileSync(process.argv[2],"utf8"));
          const now=Date.now(),n=x=>Number(x??0),xs=(d.markingGames||[]).filter(m=>m.pick&&!m.resultFinal&&Date.parse(m.date+"T"+m.time.slice(0,5)+":00+09:00")>now);
          const dir=m=>m.marketFamily==="TOTAL"?m.pick:m.marketFamily==="HANDICAP"?(n(m.handicapEffectiveLine)>0?"플핸":"마핸"):"일반승";
          const qualify=(m,q)=>["STRICT","DEEP_REVIEW"].includes(m.selectionMode)&&n(m.calibratedProbability)>0&&n(m.marketProbability)>0&&
            n(m.calibratedProbability)-n(m.marketProbability)>=.005&&n(m.calibratedProbability)*n(m.odds)-1>=-.20&&
            n(m.dataReliability)>=.55&&n(m.aiQuality)>=q&&n(m.crossAgreement)>=.50&&
            n(m.dataIntegrityScore)>=.48&&n(m.independentGroupCount)>=2&&
            n(m.axisOppositionCount)===0&&n(m.gradeAxisOppositionCount)===0;
          const stat={};for(const q of [.6,.59,.58,.57,.56,.55,.54,.53]){
            const good=xs.filter(m=>qualify(m,q));stat[q]={total:good.length,by:good.reduce((a,m)=>(a[dir(m)]=(a[dir(m)]||0)+1,a),{})};
          }
          console.log("ELITE_THRESHOLD_SCAN="+JSON.stringify(stat));
          NODE
