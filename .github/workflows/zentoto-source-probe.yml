name: Zentoto settlement source probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zentoto-source-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public legacy proto result HTML without mutation
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const u="https://v1.zentoto.com/proto/game";
            const r=await fetch(u,{headers:{"user-agent":"Mozilla/5.0 (compatible; ProtoResultAudit/1.0)","accept":"text/html"},signal:AbortSignal.timeout(20000)});
            const html=await r.text();
            const no=html.indexOf("7287"), alt=html.search(/7287/);
            console.log("ZEN_HTTP="+JSON.stringify({status:r.status,location:r.url,type:r.headers.get("content-type"),length:html.length,
              meta:html.slice(0,450),snippet:html.slice(Math.max(0,alt-1200),alt+2400),
              targetNos:[7287,7295,7310,7324,7328,7332,7346,7356].map(n=>({n,p:html.indexOf(String(n))}))}));
          })().catch(e=>{console.error("ZEN_PROBE_ERROR",String(e));process.exitCode=1;});
          NODE
