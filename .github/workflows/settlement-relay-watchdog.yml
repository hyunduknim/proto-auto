name: Official settlement relay watchdog

# R381 FREE MODE: Cloudflare cron/DO handles regular settlement.
# Retained only for manual fallback if GitHub Actions quota is later restored.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: protonumber-settlement-watchdog
  cancel-in-progress: false

jobs:
  check:
    name: Inspect live pending settlements and wake official relay if stalled
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Cloudflare Worker settlement health
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint="https://protonumber.mystyle276.workers.dev/api/state";
            let data=null,liveError=null;
            try{
              const response=await fetch(endpoint+"?watchdog="+Date.now(),{
                headers:{"cache-control":"no-cache"},signal:AbortSignal.timeout(20000)
              });
              if(!response.ok)throw Error("Settlement watchdog state HTTP "+response.status);
              data=await response.json();
            }catch(error){
              liveError=String(error?.message||error);
              core.warning("SETTLEMENT_WATCHDOG_STATE_UNAVAILABLE="+liveError.slice(0,160));
            }
            const h=data?.settlementHealth||{};
            const pending=Number(h.pending||0);
            // Check GitHub relay recency, not the direct Betman result poll:
            // a successful direct poll must not conceal a failed official relay.
            const lastRelayMs=Date.parse(h.relayLastContact||"");
            const relayAgeMinutes=Number.isFinite(lastRelayMs)?
              Math.max(0,(Date.now()-lastRelayMs)/60000):Infinity;
            // A down/unreadable Worker must not stop the recovery chain forever.
            const needsRelay=!!liveError||(pending>0&&relayAgeMinutes>=7);
            core.info("SETTLEMENT_WATCHDOG_HEALTH="+JSON.stringify({
              version:data?.version||null,round:data?.round||null,pending,
              settled:data?.summary?.settled||null,liveError,lastRelayContact:h.relayLastContact,
              relayAgeMinutes:Number.isFinite(relayAgeMinutes)?Math.round(relayAgeMinutes):null,
              staleMinutes:h.staleMinutes,stalled:h.stalled,needsRelay
            }));
            if(!needsRelay){
              core.info("Recent verified official relay or no pending games: no action.");
              return;
            }
            // Do not queue duplicate GitHub relay jobs when a scheduled or
            // live-chain execution is already running or waiting.
            const {data:existing}=await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:"official-settlement-relay.yml",per_page:20
            });
            const alreadyQueued=(existing.workflow_runs||[]).some(w=>
              ["queued","pending","in_progress","waiting","requested"].includes(w.status));
            if(alreadyQueued){
              core.info("SETTLEMENT_WATCHDOG_RELAY_ALREADY_RUNNING=1");
              return;
            }
            // Only dispatch the EXISTING OIDC-authenticated official relay.
            // Never infer unofficial outcomes or modify picks/settlement rules.
            await github.rest.actions.createWorkflowDispatch({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:"official-settlement-relay.yml",ref:"main"
            });
            core.info("SETTLEMENT_WATCHDOG_DISPATCHED=official-settlement-relay.yml");
