name: R361 diagnose overdue premium settlement without guessing
# FREE MODE: only manual GitHub Actions. Git push still deploys through independent Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify-official:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare premium unsettled to Betman official original rows
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const base="https://protonumber.mystyle276.workers.dev";
          const targetNos=new Set([7287,7295,7310,7324,7328,7332,7346,7356]);
          const src=fs.readFileSync("자동마킹.js","utf8")
            .replace(/\bexport\s+class\s+ProtoStateDO\b/,"class ProtoStateDO")
            .replace(/\bexport\s+default\s*\{[\s\S]*$/,"");
          const api=new Function("structuredClone","URL",src+
            "\nreturn {parseBetmanResultRows,resultMatchesMarket,resolveOfficialOutcome,sameOfficialGame,gameInfoRowUsableForPending};")(structuredClone,URL);
          const timeout=ms=>AbortSignal.timeout(ms);
          async function official(ts,which){
            const result=which==="results";
            const u=result?"https://www.betman.co.kr/gamebuy/winrst/inqWinrstDetlBody.do":"https://www.betman.co.kr/buyPsblGame/gameInfoInq.do";
            const ref=result?"https://www.betman.co.kr/main/mainPage/gamebuy/winrstDetl.do?gmId=G101&gmTs="+ts:
              "https://www.betman.co.kr/main/mainPage/gamebuy/gameSlip.do?gmId=G101&gmTs="+ts;
            const body=JSON.stringify({gmId:"G101",gmTs:ts,...(result?{}:{gameYear:""}),_sbmInfo:{debugMode:"false"}});
            let err;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json; charset=UTF-8",
                  accept:"application/json, text/javascript, */*; q=0.01","x-requested-with":"XMLHttpRequest",
                  origin:"https://www.betman.co.kr",referer:ref,"user-agent":"Mozilla/5.0 Chrome/126",
                  "cache-control":"no-cache"},body,signal:timeout(12500)});
                if(!r.ok)throw Error("HTTP_"+r.status);
                return await r.json();
              }catch(e){err=e;if(attempt<3)await new Promise(ok=>setTimeout(ok,1200*attempt));}
            }
            throw err;
          }
          function record(m){
            return {no:m.no,date:m.date,time:m.time,home:m.home,away:m.away,
              sport:m.sport,marketFamily:m.marketFamily,line:m.line,
              gmTs:m.gmTs,finalPick:m.pick,choices:(m.marketRows||[]).find(r=>Number(r.no)===Number(m.no))?.choices||[]};
          }
          (async()=>{
            const q=await fetch(base+"/api/state?sourceAudit="+Date.now(),{signal:timeout(24000)});
            if(!q.ok)throw Error("Worker state "+q.status);
            const state=await q.json(),time=new Date();
            const wanted=(state.markingGames||[]).filter(m=>targetNos.has(Number(m.no)));
            const premium=(state.markingGames||[]).filter(m=>m.pick&&!m.resultFinal&&
              ["가장추천","추천"].includes(m.displayGrade)&&Date.parse(String(m.date)+"T"+String(m.time).slice(0,5)+":00+09:00")<=Date.now());
            const ts=String(state.gmTs||"260120");
            const [re,gi]=await Promise.allSettled([official(ts,"results"),official(ts,"games")]);
            const resultRows=re.status==="fulfilled"?api.parseBetmanResultRows(re.value,ts):[];
            const gameRows=gi.status==="fulfilled"?api.parseBetmanResultRows(gi.value,ts):[];
            const matchAudit=items=>items.map(m=>{
              const mm=record(m),exact=resultRows.filter(r=>Number(r.no)===Number(m.no)),
                named=resultRows.filter(r=>api.sameOfficialGame(r,mm)),
                matched=resultRows.filter(r=>api.resultMatchesMarket(r,mm)),
                gameinfoMatch=gameRows.filter(r=>api.resultMatchesMarket(r,mm)),
                valid=matched.map(r=>({no:r.no,family:r.family,status:r.statusText,
                  terminal:r.terminal,score:r.score,outcome:r.outcome,projected:api.resolveOfficialOutcome(r,mm).outcome})),
                gameValid=gameinfoMatch.map(r=>({no:r.no,family:r.family,status:r.statusText,
                  terminal:r.terminal,partial:r.partial,score:r.score,
                  safe:api.gameInfoRowUsableForPending(r,[mm]),projected:api.resolveOfficialOutcome(r,mm).outcome}));
              return {no:m.no,grade:m.displayGrade,pick:m.pick,marketFamily:m.marketFamily,
                line:m.line,resultFinal:m.resultFinal||false,matchedByNumber:exact.length,
                matchedByGame:named.length,matchedResults:valid.slice(0,5),gameInfo:gameValid.slice(0,4)};
            });
            const sample=resultRows.slice(0,4).map(r=>({no:r.no,date:r.date,time:r.time,
              family:r.family,outcome:r.outcome,status:r.statusText,terminal:r.terminal,score:r.score,
              resultFieldKeys:Object.keys(r.raw||{}).slice(0,28)}));
            const numeric=resultRows.map(r=>Number(r.no)).filter(Number.isFinite).sort((a,b)=>a-b);
            const valids=resultRows.filter(r=>r.outcome||r.specialStatus||(r.score&&/^\\s*\\d+(?:\\.\\d+)?\\s*[:：-]\\s*\\d+(?:\\.\\d+)?\\s*$/.test(r.score)));
            const rawResult=Array.isArray(re.value?.detlBody)?re.value.detlBody:
              Array.isArray(re.value?.winrstDetlBody)?re.value.winrstDetlBody:[];
            const rawKeys=rawResult.flatMap(r=>Object.keys(r||{})).filter((v,i,a)=>a.indexOf(v)===i);
            const high=rawResult.filter(r=>{
              const json=JSON.stringify(r||{});
              return /7287|7295|7310|7324|7328|7332|7346|7356/.test(json);
            }).slice(0,12).map(r=>Object.fromEntries(Object.entries(r).filter(([k])=>
              /GAME_RESULT|WIN_|RSLT|SCORE|MCH_DTM|GM_DT|FIX_MCH|SORT_SEQ|HOME_TEAM|AWAY_TEAM|GAME_NO|GAME_SEQ|BETTYP|NO|SEQUENCE|ST_CD|STATUS|WL_RSLT/i.test(k))));
            console.log("R361_COVERAGE="+JSON.stringify({
              totalParsed:resultRows.length,withDecisiveOutcome:valids.length,
              minimumNo:numeric[0],maximumNo:numeric[numeric.length-1],
              latestParsed:resultRows.slice(-8).map(r=>({no:r.no,score:r.score,
                outcome:r.outcome,terminal:r.terminal,status:r.statusText,rawResult:r.raw?.GAME_RESULT,
                resultAnnouncement:r.raw?.WL_RSLT_ANNC_DTM})),
              rawResultRows:rawResult.length,rawResultKeys:rawKeys.slice(0,55),
              eightTargetRowsInRaw:high,gameinfoSchedules:gi.value?.compSchedules?.keys?.length
            }));
            console.log("R361_OFFICIAL_AUDIT="+JSON.stringify({
              version:state.version,round:state.round,gmTs:ts,time:time.toISOString(),
              settled:state.summary?.settled,pending:state.settlementHealth?.pending,
              targetCount:wanted.length,unfinishedPremium:premium.length,
              resultStatus:re.status,resultError:re.status==="rejected"?String(re.reason):null,
              resultRows:resultRows.length,gameStatus:gi.status,
              gameError:gi.status==="rejected"?String(gi.reason):null,gameRows:gameRows.length,
              resultSample:sample,premium:matchAudit(wanted),
              additionalPremium:matchAudit(premium.filter(m=>!targetNos.has(Number(m.no)))).slice(0,25)
            }));
          })().catch(e=>{console.error("R361_OFFICIAL_AUDIT_ERROR",String(e));process.exitCode=1;});
          NODE
