name: Proto realtime settlement verification and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: protonumber-worker-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate marking and official settlement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check "자동마킹.js"
      - name: Verify settlement, state persistence and public UI
        run: node tests/settlement-check.cjs
      - name: Verify R356 price EV and source authenticity
        run: node tests/r356-evidence-safety.cjs
      - name: Verify R357 authorized-source readiness and empty-feed rejection
        run: node tests/r357-feed-readiness.cjs
      - name: Verify R376 MyScoreBot pregame-only bridge, no settlement or fifth vote
        run: node tests/r376-myscorebot-bridge.cjs
      - name: Verify R377 actual pregame marking response to verified team form
        run: node tests/r377-performance-confirmation.cjs
      - name: Verify R376 GitHub Copilot MyScoreBot agent skill contract
        run: node tests/r376-agent-skill.cjs
      - name: Verify R359 live-hour ordering preserves all marking cards
        run: node tests/r359-live-hour-display.cjs
      - name: Verify R378 past hits/misses chronology and unsettled started game visibility
        run: node tests/r378-past-pending-order.cjs
      - name: Simulate R360 future-only ratios and anomaly-resistant odds
        run: node tests/r360-future-odds.cjs
      - name: Verify R370 accuracy-priority cutoff without losing any marks
        run: node tests/r370-0830-accuracy.cjs
      - name: Verify R371 exact relative grade display and historical locks
        run: node tests/r371-relative-grades.cjs
      - name: Verify R372 existing saved cards migrate without altering results
        run: node tests/r372-persisted-grade-migration.cjs
      - name: Verify R374 only the two GPT-curated draws can be marked before kickoff
        run: node tests/r374-curated-draw-only.cjs
      - name: Verify R362 premium settlement when official results are published
        run: node tests/r362-premium-settlement.cjs
      - name: Verify R365 Zentoto full-time settlement source
        run: node tests/r365-zen-settlement.cjs
      - name: Verify R380 settlement fixture recovery and resilient watchdog
        run: node tests/r380-settlement-recovery.cjs
      - name: Verify R381 free Cloudflare full-time settlement with no GitHub cron dependency
        run: node tests/r381-cloudflare-native-settlement.cjs
      - name: Verify R368 owner-requested void is narrow and clearly non-official
        run: node tests/r368-requested-void.cjs
      - name: Verify R369 invariant and signed final-score source adapters
        run: node tests/r369-one-mark-fast-score.cjs

  confirm-cloudflare:
    name: Confirm Cloudflare automatic deployment
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Workers Builds deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const checkName = 'Workers Builds: protonumber';

            for (let attempt = 1; attempt <= 60; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100
              });

              const run = data.check_runs.find(x => x.name === checkName);
              if (!run) {
                core.info(`Cloudflare check not visible yet (${attempt}/60)`);
              } else if (run.status !== 'completed') {
                core.info(`Cloudflare deployment is ${run.status} (${attempt}/60)`);
              } else if (run.conclusion === 'success') {
                core.info('Cloudflare automatic deployment succeeded.');
                core.info(run.output?.summary || '');
                return;
              } else {
                core.setFailed(`Cloudflare automatic deployment finished with: ${run.conclusion}`);
                return;
              }

              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            core.setFailed('Timed out waiting for Workers Builds: protonumber.');
      - name: Checkout deployed source version
        uses: actions/checkout@v6
      - name: Publish through Wrangler when a Cloudflare API token is configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::No Cloudflare deployment API token is configured. Checking connected Workers Builds rollout instead."
          else
            echo "Publishing the checked-out commit directly to Cloudflare Workers"
            npx --yes wrangler@4 deploy --config wrangler.jsonc
          fi
      - name: Verify propagated Worker version, ratios and settlement health
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const assert=require("node:assert/strict");
          const source=fs.readFileSync("자동마킹.js","utf8");
          const match=source.match(/const APP_VERSION = "([^"]+)";/);
          assert.ok(match,"Cannot determine source release version");
          const expected=match[1];
          const migrationId=source.match(/const R317_MARKET_MIX_ID="([^"]+)";/)?.[1];
          assert.ok(migrationId,"Cannot determine required persisted pregame repick");
          const endpoint="https://protonumber.mystyle276.workers.dev/api/state";
          const deadline=Date.now()+240000;
          const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function verify(){
            let attempts=0,lastSeen="no response",found=null;
            while(Date.now()<deadline){
              attempts++;
              try{
                const res=await fetch(endpoint+"?verify="+Date.now(),{
                  cache:"no-store",signal:AbortSignal.timeout(13000),
                  headers:{"cache-control":"no-cache"}});
                if(!res.ok)throw Error("HTTP "+res.status);
                const current=await res.json();
                lastSeen=String(current.version||"unknown");
                if(lastSeen===expected&&current.marketRebalanceAudit?.id===migrationId){found=current;break;}
                console.log("Worker rollout is not finished",attempts,":",lastSeen,"expected",expected);
              }catch(e){lastSeen=String(e?.message||e);
                console.log("Retrying production validation",attempts,lastSeen);}
              await delay(5000);
            }
            assert.ok(found,"Worker version not propagated within 4 minutes; last="+lastSeen+", expected="+expected);
            const d=found,g=d.gradeAudit||{},counts=g.counts||{},health=d.settlementHealth||{};
            if(expected.includes("R374-GPT-CURATED-DRAWS")){
              const a=d.r373DrawInterestAudit||{},
                expectedNumbers=new Set([7543,7637]),
                cards=(d.markingGames||[]).filter(m=>
                  m.selectionMode==="R373_DRAW_INTEREST"&&!m.resultFinal&&!m.gameStarted);
              assert.equal(a.id,"R374_GPT_CURATED_ROUND120_DRAWS_ONLY",
                "R374 curated draw migration did not run in production");
              assert.deepEqual((a.approvedMarkets||[]).map(x=>Number(x.no)).sort(),
                [7543,7637],"Unexpected approved draw market numbers");
              assert.ok(cards.length<=2,"At most two curated draws are allowed");
              assert.ok(cards.every(m=>expectedNumbers.has(Number(m.no))&&
                m.sport==="축구"&&m.pick==="무"&&
                ((Number(m.no)===7543&&m.marketFamily==="HANDICAP")||
                 (Number(m.no)===7637&&m.marketFamily==="MONEYLINE"))),
                "An unauthorized game was selected for a draw");
              const kst=Date.now(),current=(d.markingGames||[]).filter(m=>
                expectedNumbers.has(Number(m.no))&&!m.resultFinal&&!m.gameStarted);
              if(current.length>0)
                assert.equal(cards.length,current.length,
                  "At least one still-upcoming approved soccer draw is missing");
              console.log("R374_PRODUCTION_CURATED_DRAWS="+JSON.stringify({
                version:d.version,approved:[7543,7637],draws:cards.map(m=>({
                  no:m.no,game:m.game,date:m.date,time:m.time,pick:m.pick,
                  odds:m.odds,grade:m.displayGrade})),
                gapGames:d.fullMarkAudit?.gapGames,
                settled:d.summary?.settled,pending:d.settlementHealth?.pending
              }));
            }
            if(expected.includes("R373-EVIDENCE-DRAW-INTEREST")){
              const a=d.r373DrawInterestAudit||{};
              assert.equal(a.id,"R373_FUTURE_SOCCER_MONEYLINE_HANDICAP_DRAW_INTEREST",
                "R373 interest audit missing: persisted draw picks were not applied");
              const cards=(d.markingGames||[]).filter(m=>m.selectionMode==="R373_DRAW_INTEREST"&&
                !m.resultFinal&&!m.gameStarted);
              assert.ok(cards.length>=1&&cards.length<=2,
                "At least one real pregame soccer draw must appear in production cards");
              assert.ok(cards.every(m=>m.sport==="축구"&&m.pick==="무"&&
                Number(m.odds)>=1.31&&
                ["MONEYLINE","HANDICAP"].includes(m.marketFamily)),
                "Unverified or non-draw production marking detected");
              assert.equal(new Set(cards.map(m=>m.game)).size,cards.length,
                "One game cannot be selected twice");
              console.log("R373_PRODUCTION_DRAW_AUDIT="+JSON.stringify({
                version:d.version,round:d.round,changed:a.changed,
                cards:cards.map(m=>({no:m.no,date:m.date,time:m.time,
                  game:m.game,family:m.marketFamily,pick:m.pick,
                  odds:m.odds,grade:m.displayGrade})),
                gapGames:d.fullMarkAudit?.gapGames,
                settled:d.summary?.settled,pending:d.settlementHealth?.pending
              }));
            }
            if(expected.includes("R347-URGENT-ODDS-RECOVERY")){
              const currentDate=new Intl.DateTimeFormat("en-CA",{
                timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
              }).format(new Date());
              const rows=(d.markingGames||[]).filter(x=>
                x.date===currentDate&&String(x.time||"").startsWith("14:"));
              const state14={date:currentDate,version:d.version,round:d.round,
                sourceAudit:d.sourceAudit,updatedAt:d.updatedAt,
                games:rows.length,marked:rows.filter(x=>!!x.pick).length,
                priced:rows.filter(x=>Number(x.odds)>1).length,
                examples:rows.slice(0,20).map(x=>({
                  no:x.no,game:x.game,time:x.time,pick:x.pick,odds:x.odds,
                  marketRows:(x.marketRows||[]).map(m=>({
                    no:m.no,family:m.marketFamily,prices:(m.choices||[])
                      .map(c=>({label:c.label,odds:c.odds}))
                  }))
                }))};
              console.log("R347_14H_ODDS="+JSON.stringify(state14));
            }
            const migration=d.marketRebalanceAudit;
            assert.equal(migration?.id,migrationId,"Pregame repick migration did not run in production");
            assert.ok(migration?.at,"Missing persisted repick timestamp");
            if(migrationId==="R338_EXPLICIT_ALL_98_PREGAME_REPICK"&&expected.includes("R338-")){
              const audit=d.fullRepickAudit||{};
              assert.equal(audit.id,"R338_REPLACE_ALL_UNLOCKED_PREGAME_SELECTIONS",
                "Full repick audit missing from live server");
              assert.ok(Number(audit.requested)>0,"No pregame representatives were processed");
              assert.equal(Number(audit.unavailable),0,
                "At least one user-requested pregame pick had no valid alternative");
              assert.equal(Number(migration.changedFuture),Number(audit.requested),
                "Not all of the requested 98 pregame picks changed in live production");
              assert.equal(Number(audit.changed),Number(audit.requested),
                "Full repick audit counts disagree");
            }
            if(expected.includes("R339-RECOMMENDATION-BALANCE")){
              const rev=d.gradeRevisionAudit||{},bal=d.gradeAudit?.recommendationBalanceAudit||{};
              assert.equal(rev.id,"R339_BALANCED_RECOMMENDATION_PLUS_RISK_GUARD",
                "Recommended grades were not rebalanced in live state");
              assert.equal(Number(rev.changedPicks),0,
                "Recommendation-only release unexpectedly altered representative picks");
              assert.equal(bal.policy,rev.id,"Recommendation balance policy not live");
              assert.ok(Number(bal.plusAfter)<=Number(bal.plusBefore),
                "Plus concentration increased in recommended grade");
              assert.ok(Number(rev.currentPlus)<=Number(rev.priorPlus),
                "Persisted recommended plus handicap concentration did not improve");
            }
            if(expected.includes("R340-RECOMMENDED-PLUS-REPICK")){
              const a=d.recommendationPickAudit||{};
              assert.equal(a.id,"R340_EVIDENCE_BACKED_RECOMMENDED_PLUS_REPICK",
                "Recommended-plus representative-pick audit absent from live state");
              assert.ok(Number(a.targeted)>0,
                "No recommended-plus games were identified for representative reassessment");
              assert.equal(Number(a.reviewed),Number(a.targeted),
                "Not every recommended-plus selection was reviewed");
              assert.equal(Number(a.changed)+Number(a.withoutSafeAlternative),Number(a.targeted),
                "Recommended-plus audit is inconsistent");
              assert.equal(Number(a.changedAll),Number(a.changed),
                "Actual representative-pick changes differ from audit");
              assert.ok(Number(a.changed)>0,
                "No actual representative picks changed; do not label this release fixed");
            }
            if(expected.includes("R341-TOTAL-ONLY-CORRECTION")){
              const a=d.recommendationTotalCorrectionAudit||{};
              assert.equal(a.id,"R341_REPLACE_R340_GENERAL_WIN_WITH_TOTAL",
                "R341 same-game TOTAL correction missing from live state");
              assert.ok(Number(a.requested)>0,
                "No incorrect general-win substitutions were selected for correction");
              assert.equal(Number(a.changed),Number(a.requested),
                "Not all formerly general-win picks changed to actual Under/Over");
              assert.equal(Number(a.unavailable),0,
                "Some requested Under/Over corrections were unavailable");
              assert.equal(Number(a.unrelatedChanged),0,
                "An unrelated representative pick was changed");
              assert.ok(Array.isArray(a.examples)&&a.examples.every(x=>
                x.toFamily==="TOTAL"&&["언더","오버"].includes(x.toPick)),
                "Correction selected a non-Under/Over outcome");
            }
            if(expected.includes("R343-KJ-DRAW-WATCHLIST")){
              const audit=d.kjDrawMigrationAudit||{};
              assert.equal(audit.id,"R343_KJ_MONEYLINE_HANDICAP_DRAW_WATCHLIST",
                "K/J draw interest marking was not applied");
              assert.ok(Number(audit.changed)>=3&&Number(audit.changed)<=4,
                "Not 3-4 actual K/J draw representatives; do not report success");
              assert.equal(Number(audit.changed),Number(audit.selected),
                "Some chosen K/J draws did not become representative marks");
              assert.ok(Number(audit.byFamily?.MONEYLINE)>=1&&
                Number(audit.byFamily?.HANDICAP)>=1,
                "K/J regular draw and handicap draw were not mixed");
              assert.equal(Number(audit.changedElsewhere),0,
                "Unrelated K/J or other market representatives changed");
              assert.equal(Number(audit.changedGrades),0,
                "Original recommended/general/elite grade was changed");
              assert.equal(Number(audit.changedLocked),0,
                "Started/settled representative was altered");
            }
            if(expected.includes("R344-KJ-DRAW-2-3")){
              const audit=d.kjDrawTrimAudit||{},active=(d.markingGames||[])
                .filter(m=>m.selectionMode==="KJ_DRAW_INTEREST"&&!m.gameStarted&&!m.resultFinal);
              assert.equal(audit.id,"R344_KJ_DRAW_2_TO_3_PER_ROUND",
                "2-3 K/J draw migration missing in live worker");
              assert.ok(active.length>=2&&active.length<=3,
                "Actual unstarted K/J draw watchlist is not 2-3 games");
              assert.equal(active.length,Number(audit.remainingActive),
                "Live draw marking count differs from persisted R344 audit");
              assert.ok(active.every(m=>m.pick==="무"&&
                ["MONEYLINE","HANDICAP"].includes(m.marketFamily)&&
                /(?:K리그|K[12]리그|J[123]?리그|J[123]?LEAGUE|KLEAGUE)/i.test(m.league||"")),
                "Non K/J or non-draw representative was marked as K/J draw");
              assert.ok(new Set(active.map(m=>m.marketFamily)).size>=2,
                "K/J watchlist must include both regular and handicap draws");
              assert.ok(new Set(active.map(m=>/J/i.test(m.league||"")?"J":"K")).size>=2,
                "K/J watchlist must include both leagues when available");
              assert.equal(Number(audit.unavailable?.length||0),0,
                "Excess draw could not be restored safely");
            }
            if(expected.includes("R345-RECOMMENDED-FAVORITES")){
              const a=d.recommendedFavoriteGuaranteeAudit||{},
                f=d.recommendedFavoriteGuaranteeLiveAudit||{};
              assert.equal(a.id,"R345_RECOMMENDED_MONEYLINE_FAVORITE_GUARD",
                "Recommended favorites correction did not persist");
              assert.equal(Number(a.final?.underdogs),0,
                "Some unstarted recommended general-win marks remain underdogs");
              assert.equal(Number(a.final?.undecidable),0,
                "Some unstarted recommended general-win marks have no valid favorite >=1.31");
              assert.equal(Number(f.underdogs),0,
                "Live recommended general-win selection still has underdog");
              assert.equal(Number(f.undecidable),0,
                "Live recommended general-win has unavailable favorite");
              assert.equal(Number(a.otherMarketChanged),0,
                "Unrelated representative market was modified");
              assert.deepEqual(d.marketMixAudit?.target,
                {MONEYLINE:30,HANDICAP:30,TOTAL:40},
                "Global market mix target changed from 30/30/40");
              assert.ok(Number(a.preservedLocked)>=0,
                "Missing started/settled game preservation report");
            }
            if(expected.includes("R346-LOW-FAVORITE-MINUS-HANDICAP")){
              const a=d.recommendedLowOddsHandicapAudit||{},
                live=d.recommendedLowOddsHandicapLiveAudit||{};
              assert.equal(a.id,"R346_INTEREST_ONLY_LOW_FAVORITE_TO_MINUS_HANDICAP",
                "Low-odds minus-handicap migration missing from live Worker");
              assert.ok(Number(a.reviewed)>=0&&Number(a.changed)>=0,
                "Low-odds review counters missing");
              assert.equal(Number(a.actualChanged),Number(a.changed),
                "Saved representative swaps differ from audit");
              assert.equal(Number(a.unrelatedChanged),0,
                "Unrelated markets were modified by the low-odds rule");
              assert.ok(Number(a.preservedLocked)>=0,
                "Locked picks preservation audit missing");
              assert.equal(Number(a.marketCountsBefore?.MONEYLINE)-Number(a.changed),
                Number(a.marketCountsAfter?.MONEYLINE),
                "Moneyline market count change inconsistent");
              assert.equal(Number(a.marketCountsBefore?.HANDICAP)+Number(a.changed),
                Number(a.marketCountsAfter?.HANDICAP),
                "Handicap market count change inconsistent");
              assert.ok((a.changes||[]).every(x=>
                x.fromFamily==="MONEYLINE"&&x.toFamily==="HANDICAP"&&
                x.fromPick===x.toPick&&Number(x.effectiveHandicap)<0&&
                Number(x.fromOdds)>=1.31&&Number(x.fromOdds)<=1.45&&
                Number(x.toOdds)>Number(x.fromOdds)),
                "Swaps must retain the favorite team and use only its minus handicap");
              assert.equal(live.id,a.id,
                "Live low-odds handicap review not enabled");
              assert.deepEqual(d.marketMixAudit?.target,
                {MONEYLINE:30,HANDICAP:30,TOTAL:40},
                "30/30/40 market targets unexpectedly changed");
            }
            if(expected.includes("R350-7093-OVER-7097-PLUS")){
              const audit=d.manualNumberMarkAudit||{},rows=audit.rows||[];
              const row7092=rows.find(x=>Number(x.no)===7092),row7097=rows.find(x=>Number(x.no)===7097);
              assert.equal(audit.id,"R350_MANUAL_7092_SAME_GAME_7093_OVER_AND_7097_PLUS",
                "Exact-number marking audit missing from production");
              assert.ok(row7092&&row7097,"Both requested proto numbers must be checked");
              assert.equal(row7092.targetNo,7093,"7092 request must resolve to same-game U/O #7093");
              assert.equal(row7092.family,"TOTAL","7093 must be an Under/Over market");
              assert.equal(row7092.pick,"오버","7092 must be marked Over");
              assert.equal(row7097.family,"HANDICAP","7097 must be a handicap market");
              assert.equal(row7097.handicapDirection,"PLUS",
                "7097 must be marked positive handicap");
              assert.ok(Number(row7097.odds)>1&&
                Boolean(row7097.belowStandardFloor)===(Number(row7097.odds)<1.31),
                "7097 manual marking must disclose whether the live odds break the 1.31 floor");
              assert.equal(Number(audit.applied),2,
                "Both requested proto numbers must have official odds and be applied");
              const active=(d.markingGames||[]).filter(x=>x.pick&&!x.resultFinal);
              assert.ok(active.some(x=>Number(x.no)===7093&&
                x.marketFamily==="TOTAL"&&x.pick==="오버"),
                "7093 Over missing in actual representative cards");
              assert.ok(active.some(x=>Number(x.no)===7097&&
                x.marketFamily==="HANDICAP"&&x.handicapDirection==="플핸"),
                "7097 positive handicap missing in actual representative cards");
            }
            if(expected.includes("R351-RECOMMENDED-OVER-GUARD")){
              const a=d.recommendedDirectionMigrationAudit||{},q=d.gradeAudit?.recommendationTotalDirectionAudit||{};
              assert.equal(a.id,"R351_RECOMMENDED_OVER_EVIDENCE_GUARD",
                "Live recommended-Over rebalance did not run");
              assert.equal(q.id,a.id,"Recommendation directional guard missing in live grade audit");
              assert.equal(Number(a.changedPicks),0,"Unrequested representative picks changed");
              assert.ok(Number(a.overAfter)<=Number(a.overBefore),
                "Recommended Over concentration failed to decrease or remain stable");
              assert.equal(Number(a.overAfter),Number(q.overAfter),
                "Persisted and live Over counts disagree");
              assert.ok(Number(a.changedGrades)>0,
                "No actual recommended-grade selections changed; do not claim the skew was repaired");
              assert.deepEqual(d.marketMixAudit?.target,{MONEYLINE:30,HANDICAP:30,TOTAL:40},
                "30/30/40 market target must not be altered");
              const rows=d.manualNumberMarkAudit?.rows||[];
              const customOver=rows.find(x=>Number(x.no)===7092),
                customPlus=rows.find(x=>Number(x.no)===7097);
              if(String(d.gmTs||"")==="260120"){
                assert.equal(customOver?.pick,"오버","User specified Over changed");
                assert.equal(customPlus?.handicapDirection,"PLUS","User specified plus handicap changed");
              }
            }
            if(expected.includes("R352-RECOMMENDED-OVER-EVIDENCE-RECHECK")){
              const a=d.recommendedDirectionMigrationAudit||{},q=d.gradeAudit?.recommendationTotalDirectionAudit||{};
              assert.equal(a.id,"R352_RECOMMENDED_OVER_EVIDENCE_GUARD",
                "Live R352 recommendation-direction migration missing");
              assert.equal(q.id,a.id,
                "Live recommended Over/Under ratio audit missing");
              assert.equal(Number(a.changedPicks),0,
                "R352 changed actual representative picks without permission");
              assert.ok(Number(a.overAfter)<=Number(a.overBefore),
                "Recommended Over concentration got worse");
              assert.equal(Number(a.overAfter),Number(q.overAfter),
                "Live recommended Over counts disagree");
              assert.ok(Number(q.softOverLimit)<=Math.max(Number(q.total),Math.ceil(Number(q.total)*.55))&&
                Number(q.softOverLimit)>=Math.ceil(Number(q.total)*.55),
                "R352 55% soft concentration alert not applied");
              assert.deepEqual(d.marketMixAudit?.target,
                {MONEYLINE:30,HANDICAP:30,TOTAL:40},
                "User's market balance 30/30/40 was changed");
            }
            if(expected.includes("R353-RECOMMENDED-PLUS-FIVE")){
              const a=d.recommendedPlusToTotalAudit||{};
              assert.equal(a.id,"R353_RECOMMENDED_PLUS_FIVE_FOUR_SAME_GAME_TOTAL",
                "Live 9-to-5 recommended plus-handicap conversion did not run");
              assert.ok(Number(a.after)<=5||Number(a.lockedPlus)>5,
                "Recommended plus-handicap count still exceeds five");
              assert.ok(Number(a.planned)>=Math.min(4,Math.max(0,Number(a.before)-5))||
                Number(a.lockedPlus)>=5,
                "Four same-game total replacements were not persisted");
              assert.deepEqual(d.marketMixAudit?.target,
                {MONEYLINE:30,HANDICAP:30,TOTAL:40},
                "Original market-mix targets were altered");
              assert.ok(Number(a.preservedLocked)>=0,
                "Started/settled selections preservation was not checked");
            }
            if(expected.includes("R355-EVIDENCE-PRIORITY")){
              const q=d.qualityPriorityAudit||{},live=(d.markingGames||[])
                .filter(x=>x.pick&&!x.gameStarted&&!x.resultFinal);
