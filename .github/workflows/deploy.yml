name: Proto realtime settlement verification and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: protonumber-worker-production
  cancel-in-progress: true

jobs:
  verify:
    name: Validate marking and official settlement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check "자동마킹.js"
      - name: Verify settlement, state persistence and public UI
        run: node tests/settlement-check.cjs

  confirm-cloudflare:
    name: Confirm Cloudflare automatic deployment
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Workers Builds deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const checkName = 'Workers Builds: protonumber';

            for (let attempt = 1; attempt <= 60; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100
              });

              const run = data.check_runs.find(x => x.name === checkName);
              if (!run) {
                core.info(`Cloudflare check not visible yet (${attempt}/60)`);
              } else if (run.status !== 'completed') {
                core.info(`Cloudflare deployment is ${run.status} (${attempt}/60)`);
              } else if (run.conclusion === 'success') {
                core.info('Cloudflare automatic deployment succeeded.');
                core.info(run.output?.summary || '');
                return;
              } else {
                core.setFailed(`Cloudflare automatic deployment finished with: ${run.conclusion}`);
                return;
              }

              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            core.setFailed('Timed out waiting for Workers Builds: protonumber.');
      - name: Checkout deployed source version
        uses: actions/checkout@v6
      - name: Verify propagated Worker version, ratios and settlement health
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const assert=require("node:assert/strict");
          const source=fs.readFileSync("자동마킹.js","utf8");
          const match=source.match(/const APP_VERSION = "([^"]+)";/);
          assert.ok(match,"Cannot determine source release version");
          const expected=match[1];
          const endpoint="https://protonumber.mystyle276.workers.dev/api/state";
          const deadline=Date.now()+240000;
          const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function verify(){
            let attempts=0,lastSeen="no response",found=null;
            while(Date.now()<deadline){
              attempts++;
              try{
                const res=await fetch(endpoint+"?verify="+Date.now(),{
                  cache:"no-store",signal:AbortSignal.timeout(13000),
                  headers:{"cache-control":"no-cache"}});
                if(!res.ok)throw Error("HTTP "+res.status);
                const current=await res.json();
                lastSeen=String(current.version||"unknown");
                if(lastSeen===expected){found=current;break;}
                console.log("Worker rollout is not finished",attempts,":",lastSeen,"expected",expected);
              }catch(e){lastSeen=String(e?.message||e);
                console.log("Retrying production validation",attempts,lastSeen);}
              await delay(5000);
            }
            assert.ok(found,"Worker version not propagated within 4 minutes; last="+lastSeen+", expected="+expected);
            const d=found,g=d.gradeAudit||{},counts=g.counts||{},health=d.settlementHealth||{};
            assert.ok(d.summary&&g.counts,"Live source lacks marking grade audit");
            const countTotal=Number(counts["가장추천"]||0)+Number(counts["추천"]||0)+Number(counts["일반"]||0);
            if(Number(g.total||0)>0)assert.equal(countTotal,Number(g.total),"Invalid grade counters");
            assert.ok(d.settlementHealth&&Number.isFinite(Number(health.pending)),
              "Official settlement health not exposed in live release");
            const q=d.summary||{};
            const result={version:d.version,round:d.round,grades:counts,
              settled:Number(q.settled||0),hits:Number(q.hits||0),misses:Number(q.misses||0),
              pending:health.pending,officialChannel:health.mode,
              lastOfficialResultAt:health.lastOfficialResultAt||null,
              verifiedAfterAttempts:attempts};
            const a=d.gradeAudit||{},dir=a.totalDirectionAudit||{};
            const list=(d.markingGames||[]).filter(m=>m.pick&&!m.resultFinal);
            const dirOf=(grade,pick)=>list.filter(m=>m.displayGrade===grade&&m.pick===pick).length;
            result.markingDirections={
              eliteUnder:dirOf("가장추천","언더"),eliteOver:dirOf("가장추천","오버"),
              recommendedUnder:dirOf("추천","언더"),recommendedOver:dirOf("추천","오버"),
              normalOver:dirOf("일반","오버")};
            result.eliteDirectionAudit={
              candidateOver:dir.candidateOver||0,
              qualifiedOver:dir.qualifiedOver||0,
              selectedOver:dir.selectedOver||0,
              selectedUnder:dir.selectedUnder||0,
              qualityOverCandidates:dir.qualityOverCandidates||0,
              overReserveFilled:dir.overReserveFilled||0};
            result.overRebalance=d.marketMixAudit?.totalDirectionBalance||null;
            console.log("PRODUCTION_HEALTH="+JSON.stringify(result));
            const summary=process.env.GITHUB_STEP_SUMMARY;
            if(summary)fs.appendFileSync(summary,
              "### Verified production release\n\n"+Object.entries(result).map(([k,v])=>
              "- **"+k+"**: "+(v&&typeof v==="object"?JSON.stringify(v):String(v))).join("\n")+"\n");
          }
          verify().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
