name: live
# R804 실시간 중계: one pass a minute for ~5h45m; a new run is queued by the schedule and starts when the previous ends.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/live
            tools/apifootball
      - name: Loop
        env:
          K: ${{ secrets.API_FOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          mkdir -p keep
          curl -sf "https://raw.githubusercontent.com/$REPO/live/live.json?t=$(date +%s)" -o keep/live.json || true
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            rm -rf prev af out && mkdir -p prev af
            [ -s keep/live.json ] && cp keep/live.json prev/live.json
            curl -sf "https://raw.githubusercontent.com/$REPO/apifootball/af_soccer.json?t=$t0" -o af/af_soccer.json || true
            python3 tools/live/live.py || true
            if [ -s out/live.json ]; then
              cp out/live.json keep/live.json
              # R807: push straight to the site (the raw GitHub address served copies several minutes old)
              tok=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=protonumber-official-settlement" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])" 2>/dev/null || true)
              [ -n "$tok" ] && curl -sS -m 20 -o /dev/null -w "push %{http_code}\n" -X POST -H "Authorization: Bearer $tok" -H "content-type: application/json" --data-binary @out/live.json https://protonumber.mystyle276.workers.dev/api/live-push || true
              ( cd out && git init -q -b live && git config user.name live-bot && git config user.email live-bot@users.noreply.github.com && git add live.json && git commit -qm live && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" live ) || echo push-failed
            fi
            s=$(( 60 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
          # R819: hand over to the next run straight away (GitHub's schedule can skip for hours) — retried, queued behind this one
          for i in 1 2 3 4 5; do gh workflow run live.yml -R "$REPO" --ref main && break; sleep $((i*15)); done
