name: Diagnostic snapshot (read-only)

# R604: lets the assistant read the live site's /check output without asking the owner to download files.
# Fetches one public /check page and stores it on the "diag" branch (overwritten each run). Never writes to the site.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "query string for /check (e.g. src or no=9331,9332)"
        required: false
        default: "src"
      espn:
        description: "optional ESPN public API path after /apis/ (read-only probe)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: diag-snapshot
  cancel-in-progress: true

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch /check and publish to the diag branch
        env:
          Q: ${{ github.event.inputs.query }}
          E: ${{ github.event.inputs.espn }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir out && cd out
          curl -sS -m 60 "https://protonumber.mystyle276.workers.dev/check?${Q}" -o check.json
          if [ -n "$E" ]; then
            i=0
            IFS='|' read -ra PARTS <<< "$E"
            for P in "${PARTS[@]}"; do
              if printf '%s' "$P" | grep -Eq '^site/v2/sports/[a-z]+/[a-z0-9._-]+/[A-Za-z0-9/._?=&,-]+$'; then
                if [ $i -eq 0 ]; then curl -sS -m 60 --compressed "https://site.api.espn.com/apis/${P}" -o espn.json || true; fi
                curl -sS -m 60 --compressed "https://site.api.espn.com/apis/${P}" -o "espn_${i}.json" || true
              fi
              i=$((i+1)); [ $i -ge 20 ] && break
            done
          fi
          date -u +%FT%TZ > at.txt
          echo "$Q" > query.txt
          git init -q -b diag
          git config user.name "diag-bot"; git config user.email "diag-bot@users.noreply.github.com"
          git add . && git commit -qm "diag snapshot"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" diag
