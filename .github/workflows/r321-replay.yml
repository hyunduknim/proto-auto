name: R321 isolated replay, no production deployment

# FREE MODE: only manual GitHub Actions. Git push still deploys through independent Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-live-snapshot-replay:
    name: Replay production snapshot against PR code only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch read-only exported live state into temporary runner storage
        shell: bash
        run: |
          curl -fsSL --retry 2 --max-time 90 'https://protonumber.mystyle276.workers.dev/api/export-json' -o "$RUNNER_TEMP/prod-export.json"
          node -e "const s=require(process.env.RUNNER_TEMP+'/prod-export.json');if(!s.currentRound?.markets?.length)throw Error('Missing real markets');console.log('SNAPSHOT',s.round?.round,'markets',s.currentRound.markets.length)"
      - name: Simulate new marking and settlement locks without writes
        run: node tests/replay-live.cjs "$RUNNER_TEMP/prod-export.json"
      - name: Double-check R370 against earlier algorithm on identical production export
        run: node tests/r370-compare-live.cjs "$RUNNER_TEMP/prod-export.json"
