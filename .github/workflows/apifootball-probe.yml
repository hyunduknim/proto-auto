name: apifootball-probe
on:
  workflow_dispatch:
    inputs:
      path:
        description: "API path after https://v3.football.api-sports.io (e.g. /status)"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call API-Football and keep a short sample on the diag branch
        env:
          K: ${{ secrets.API_FOOTBALL_KEY }}
          P: ${{ github.event.inputs.path }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          printf '%s' "$P" | grep -Eq '^/[A-Za-z0-9/_.?=&,-]+$' || { echo bad path; exit 1; }
          K=$(printf '%s' "$K" | tr -d '[:space:]"'"'")
          mkdir out && cd out
          echo "{\"keyLen\":${#K}}" > key.json
          code=$(curl -sS -m 60 -o raw.json -w '%{http_code}' -H "x-apisports-key: $K" "https://v3.football.api-sports.io$P" || true)
          python3 - "$code" <<'PY'
          import json,sys
          code=sys.argv[1]
          try: d=json.load(open('raw.json'))
          except Exception: d=open('raw.json',errors='replace').read()[:3000]
          def cut(x,depth=0):
              if isinstance(x,list): return [cut(v,depth+1) for v in x[:3]]+([f'...{len(x)} items'] if len(x)>3 else [])
              if isinstance(x,dict): return {k:cut(v,depth+1) for k,v in list(x.items())[:40]}
              if isinstance(x,str): return x[:200]
              return x
          json.dump({'status':code,'sample':cut(d)},open('check.json','w'),ensure_ascii=False,indent=1)
          PY
          rm -f raw.json
          git init -q -b diag
          git config user.name "diag-bot"; git config user.email "diag-bot@users.noreply.github.com"
          git add . && git commit -qm "api-football probe"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" diag
