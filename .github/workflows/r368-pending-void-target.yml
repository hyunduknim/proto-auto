name: R368 pending void target audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r368-pending-void-target.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Identify open representative picks, no writes
        run: |
          node <<'NODE'
          (async()=>{
            const r=await fetch('https://protonumber.mystyle276.workers.dev/api/state?audit='+Date.now(),{signal:AbortSignal.timeout(25000),headers:{'cache-control':'no-cache'}});
            if(!r.ok)throw Error('HTTP '+r.status);
            const d=await r.json(),now=Date.now();
            const pending=(d.markingGames||[]).filter(x=>x.pick&&!x.resultFinal&&
              Date.parse(String(x.date)+'T'+String(x.time).slice(0,5)+':00+09:00')<=now)
              .map(x=>({no:x.no,gmTs:x.gmTs,date:x.date,time:x.time,
                game:x.game,grade:x.displayGrade,market:x.market,
                family:x.marketFamily,line:x.line,pick:x.pick,odds:x.odds,
                startedHours:Math.round((now-Date.parse(x.date+'T'+String(x.time).slice(0,5)+':00+09:00'))/360000)/10}));
            console.log('R368_PENDING_TARGET='+JSON.stringify({version:d.version,round:d.round,
              at:new Date().toISOString(),summary:d.summary,health:d.settlementHealth,
              pending,official:d.relayAudit&&{verified:d.relayAudit.verifiedRows,
                at:d.relayAudit.at,settledNow:d.relayAudit.settledNow},
              historicalVoids:(d.pastGames||[]).filter(x=>x.settlementStatus==='적특').map(x=>x.no)}));
          })().catch(e=>{console.error('R368_AUDIT_ERROR',String(e));process.exitCode=1})
          NODE
