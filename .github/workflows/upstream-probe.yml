name: Probe upstream official result connectivity
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upstream-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official results POST endpoints from external runner
        run: |
          node <<'NODE'
          const apis=[
            ["SOURCE","https://www.betman.co.kr/buyPsblGame/inqCacheBuyAbleGameInfoList.do",{_sbmInfo:{debugMode:"false"}},"https://www.betman.co.kr/main/mainPage/gamebuy/buyableGameList.do"],
            ["RESULT","https://www.betman.co.kr/gamebuy/winrst/inqWinrstDetlBody.do",{gmId:"G101",gmTs:"260120",_sbmInfo:{debugMode:"false"}},"https://www.betman.co.kr/main/mainPage/gamebuy/winrstDetl.do"],
            ["GAMEINFO","https://www.betman.co.kr/buyPsblGame/gameInfoInq.do",{gmId:"G101",gmTs:"260120",gameYear:"",_sbmInfo:{debugMode:"false"}},"https://www.betman.co.kr/main/mainPage/gamebuy/gameSlip.do?gmId=G101&gmTs=260120"]
          ];
          (async()=>{
          await Promise.all(apis.map(async ([name,url,payload,ref])=>{
            const ac=new AbortController();const start=Date.now();const timer=setTimeout(()=>ac.abort(),10000);
            try{
              const r=await fetch(url,{method:"POST",redirect:"follow",headers:{"content-type":"application/json; charset=UTF-8","accept":"application/json, text/javascript, */*; q=0.01","x-requested-with":"XMLHttpRequest","origin":"https://www.betman.co.kr","referer":ref,"user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36","cache-control":"no-cache","pragma":"no-cache"},body:JSON.stringify(payload),signal:ac.signal});
              const text=await r.text();let j;try{j=JSON.parse(text)}catch{}
              console.log("OFFICIAL_UPSTREAM="+JSON.stringify({name,status:r.status,elapsedMs:Date.now()-start,contentType:r.headers.get("content-type"),bytes:text.length,validJson:!!j,dataKeys:j?Object.keys(j).slice(0,10):[]}));
            }catch(e){console.log("OFFICIAL_UPSTREAM="+JSON.stringify({name,status:"NETWORK_ERROR",elapsedMs:Date.now()-start,error:e?.message||String(e)}))}
            finally{clearTimeout(timer)}
          }))
          })();
          NODE
      - name: Inspect live elite grade distribution
        run: |
          curl --fail --silent --show-error --max-time 12 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/proto-state.json"
          node -e 'const d=require(process.argv[1]);const g=d.gradeAudit||{};const x={round:d.round,counts:g.counts,eligibleCounts:g.eligibleCounts,targetCounts:g.targetCounts,lockedCounts:g.lockedCounts,shortfall:g.shortfall,ranking:g.ranking,fullMark:d.fullMarkAudit?.coverage,representativeGrades:(d.markingGames||[]).reduce((o,m)=>(o[m.displayGrade||"일반"]=(o[m.displayGrade||"일반"]||0)+1,o),{})};console.log("LIVE_GRADE_AUDIT="+JSON.stringify(x));' "$RUNNER_TEMP/proto-state.json"
      - name: Audit premium candidate quality distribution
        run: |
          curl --fail --silent --show-error --max-time 12 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/grades.json"
          node -e 'const d=require(process.argv[1]),m=(d.markingGames||[]).filter(x=>!x.resultFinal&&x.pick&&x.odds>=1.31);const n=x=>Number(x??0),rank=(f)=>m.slice().sort((a,b)=>f(b)-f(a)).slice(0,5).map(x=>({sport:x.sport,selectionMode:x.selectionMode,odds:x.odds,edge:n(x.calibratedProbability)-n(x.marketProbability),EV:n(x.calibratedProbability)*n(x.odds)-1,p:n(x.calibratedProbability),safe:n(x.conservativeProbability),mp:n(x.marketProbability),quality:n(x.aiQuality),rel:n(x.dataReliability),cross:n(x.crossAgreement),integrity:n(x.dataIntegrityScore),groups:x.independentGroupCount,opposition:x.gradeAxisOppositionCount}));const o={count:m.length,modes:m.reduce((a,x)=>(a[x.selectionMode||"null"]=(a[x.selectionMode||"null"]||0)+1,a),{}),withPositiveEV:m.filter(x=>n(x.calibratedProbability)*n(x.odds)>1).length,withPositiveEdge:m.filter(x=>n(x.calibratedProbability)>n(x.marketProbability)).length,reliabilityG55:m.filter(x=>n(x.dataReliability)>=.55).length,groupsG2:m.filter(x=>n(x.independentGroupCount)>=2).length,eliteCompatibleStrict:m.filter(x=>x.selectionMode==="STRICT").length,topEV:rank(x=>n(x.calibratedProbability)*n(x.odds)-1),topQuality:rank(x=>n(x.aiQuality))};console.log("PREMIUM_CANDIDATES="+JSON.stringify(o));' "$RUNNER_TEMP/grades.json"
      - name: Grade fallback eligibility counts
        run: |
          curl --fail --silent --show-error --max-time 10 "https://protonumber.mystyle276.workers.dev/api/state" -o "$RUNNER_TEMP/proto-state.json"
          node -e 'const d=require(process.argv[1]);const xs=(d.markingGames||[]).filter(m=>m.pick&&m.odds>=1.31&&!m.resultFinal&&m.selectionMode==="STRICT");const n=x=>Number(x??0);const el=(m,minQ,minCross,minEv)=> n(m.aiQuality)>=minQ&&n(m.crossAgreement)>=minCross&&n(m.dataReliability)>=.57&&n(m.dataIntegrityScore)>=.52&&n(m.calibratedProbability)-n(m.marketProbability)>=.01&&n(m.calibratedProbability)*n(m.odds)-1>=minEv&&n(m.gradeAxisOppositionCount)===0&&n(m.axisOppositionCount)===0;console.log("ELITE_ELIGIBILITY="+JSON.stringify({strictCount:xs.length,q6:xs.filter(m=>el(m,.60,.55,-.12)).length,q55:xs.filter(m=>el(m,.55,.5,-.12)).length,q5:xs.filter(m=>el(m,.50,.45,-.12)).length,allValue:xs.filter(m=>n(m.calibratedProbability)*n(m.odds)-1>=0).length}));' "$RUNNER_TEMP/proto-state.json"
