name: statshawk-probe
on:
  workflow_dispatch:
    inputs:
      path:
        description: "API path after https://api.statshawk.ai (e.g. /v1/competitions)"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call StatsHawk and keep a short sample on the diag branch
        env:
          K: ${{ secrets.STATSHAWK_KEY }}
          P: ${{ github.event.inputs.path }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          printf '%s' "$P" | grep -Eq '^(/v1/[A-Za-z0-9/_.?=&,-]+|/openapi.json)$' || { echo bad path; exit 1; }
          mkdir out && cd out
          RAWLEN=${#K}; K=$(printf '%s' "$K" | tr -d '[:space:]"'"'"); echo "{\"keyLen\":$RAWLEN,\"trimmedLen\":${#K}}" > key.json
          code=$(curl -sSL -m 60 -o raw.json -w '%{http_code}' -H "X-API-Key: $K" -H "Accept: application/json" "$( [ "$P" = /openapi.json ] && echo https://www.statshawk.ai || echo https://api.statshawk.ai)$P" || true)
          if [ "$code" = "401" ]; then c2=$(curl -sS -m 60 -o raw2.json -w '%{http_code}' -H "Authorization: Bearer $K" -H "Accept: application/json" "https://api.statshawk.ai$P" || true); c3=$(curl -sS -m 60 -o raw3.json -w '%{http_code}' -H "Accept: application/json" "https://api.statshawk.ai$P?api_key=$K" || true); echo "{\"bearer\":\"$c2\",\"query\":\"$c3\"}" > alt.json; if [ "$c2" = "200" ]; then mv raw2.json raw.json; code=$c2; fi; rm -f raw2.json raw3.json; fi
          python3 - "$code" <<'PY'
          import json,sys
          code=sys.argv[1]
          try: d=json.load(open('raw.json'))
          except Exception: d=open('raw.json',errors='replace').read()[:3000]
          def cut(x,depth=0):
              if isinstance(x,list): return [cut(v,depth+1) for v in x[:4]]+([f'...{len(x)} items'] if len(x)>4 else [])
              if isinstance(x,dict): return {k:cut(v,depth+1) for k,v in list(x.items())[:40]}
              if isinstance(x,str): return x[:200]
              return x
          slugs=None
          if isinstance(d,dict) and 'paths' in d:
              slugs=[[k,','.join(m for m in v.keys()),' '.join((v.get('get') or {}).get('summary','').split())[:90],[p.get('name') for p in (v.get('get') or {}).get('parameters',[]) if isinstance(p,dict)]] for k,v in d['paths'].items()]
              d={'info':d.get('info')}
          try:
              it=d['data']['items'];slugs=[[x.get('slug') or x.get('id'),x.get('sport'),x.get('id')] for x in it][:120]
          except Exception: pass
          shape=None
          def sh(x,depth=0):
              if depth>5: return '..'
              if isinstance(x,dict): return {k:sh(v,depth+1) for k,v in list(x.items())[:30]}
              if isinstance(x,list): return [sh(x[0],depth+1),len(x)] if x else []
              return x
          shape=sh(d)
          json.dump({'status':code,'list':slugs,'shape':shape,'sample':cut(d)},open('check.json','w'),ensure_ascii=False,indent=1)
          PY
          rm -f raw.json
          git init -q -b diag
          git config user.name "diag-bot"; git config user.email "diag-bot@users.noreply.github.com"
          git add . && git commit -qm "statshawk probe"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" diag
